name: AutoBookkeeping
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

fileGroups:
  - AutoBookkeeping
  - BookkeepingWidget

targets:
  AutoBookkeeping:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoBookkeeping
        excludes:
          - "**/*.md"
          - "**/README*"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.autobookkeeping
        INFOPLIST_FILE: AutoBookkeeping/Resources/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"AutoBookkeeping/Resources/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: BookkeepingWidget
        embed: true
    entitlements:
      path: AutoBookkeeping/Resources/AutoBookkeeping.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourcompany.autobookkeeping
        com.apple.developer.siri: true

  BookkeepingWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BookkeepingWidget
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.autobookkeeping.widget
        INFOPLIST_FILE: BookkeepingWidget/Info.plist
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
    entitlements:
      path: BookkeepingWidget/BookkeepingWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourcompany.autobookkeeping

schemes:
  AutoBookkeeping:
    build:
      targets:
        AutoBookkeeping: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
